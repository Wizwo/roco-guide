name: 更新宠物数据

on:
  schedule:
    # 每天早上6点自动更新（北京时间 UTC-8 = 2:00 UTC）
    - cron: '0 2 * * *'
  workflow_dispatch:   # 支持手动触发
  push:
    branches:
      - main
    paths:
      - 'scripts/scrape-pets.js'
      - '.github/workflows/update-data.yml'

jobs:
  update-pets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行爬虫
        run: node scripts/scrape-pets.js

      - name: 检查并提交更新
        run: |
          # 判断 pets.json 是否有变化
          if ! git diff --quiet data/pets.json; then
            echo "发现数据更新，提交..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/pets.json
            git commit -m "🤖 自动更新宠物数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
