// ═══════════ 渲染 ═══════════
function getPetId() {
  const p = new URLSearchParams(window.location.search);
  return p.get('id') || 'shenglong';
}

function renderPet(pet) {
  if (!pet) {
    document.getElementById('petContent').innerHTML = '<p style="text-align:center;padding:60px;color:var(--text-muted)">🐾 宠物未找到<br><a href="index.html#tier" style="color:var(--accent-gold)">返回天梯榜</a></p>';
    return;
  }
  document.title = pet.name + ' — 宠物详情 | 洛克王国攻略站';
  document.getElementById('breadName').textContent = pet.name;

  const stats = pet.stats;
  const statKeys = [
    {key:'hp',label:'生命 HP'},{key:'atk',label:'攻击 ATK'},{key:'def',label:'防御 DEF'},
    {key:'spa',label:'特攻 SP.ATK'},{key:'spd',label:'特防 SP.DEF'},{key:'spe',label:'速度 SPD'}
  ];

  const html = `
  <section class="pet-header">
    <div class="pet-avatar-large" style="background:${pet.color};border-color:${pet.border};box-shadow:0 0 40px ${pet.glow}">${pet.icon}</div>
    <div class="pet-meta">
      <div class="tier-badge ${pet.tier}">${pet.tier} 级</div>
      <h1>${pet.name}</h1>
      <p class="sub">${pet.type} · ${pet.rarity}品质 · ${pet.role}</p>
      <div class="pet-tags-row">${pet.tags.map(t => `<span class="tag-rarity">${t}</span>`).join('')}</div>
      ${pet.desc ? `<p style="margin-top:16px;font-size:14px;color:var(--text-secondary);line-height:1.6">💬 ${pet.desc}</p>` : ''}
    </div>
  </section>

  <section class="stat-section">
    <h2>📊 基础属性</h2>
    <div class="stat-grid">
      ${statKeys.map(s => {
        const val = stats[s.key] || 0;
        const pct = Math.min(100, Math.round(val / 1.8));
        return `<div class="stat-card"><div class="label">${s.label}</div><div class="value">${val}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div></div>`;
      }).join('')}
    </div>
  </section>

  <section class="stat-section">
    <h2>⚔️ 核心技能</h2>
    <div class="skill-list">
      ${pet.skills.map(s => `
        <div class="skill-card">
          <div class="skill-icon" style="background:${s.bg}">${s.icon}</div>
          <div class="skill-info"><div class="skill-name">${s.name}</div><div class="skill-desc">${s.desc}</div></div>
          <div class="skill-meta">${s.meta.split('·').map(m=>`<div>${m.trim()}</div>`).join('')}</div>
        </div>
      `).join('')}
    </div>
  </section>

  <section class="stat-section">
    <h2>🔄 进化路线</h2>
    <div class="evo-chain">
      ${pet.evolution.map((e,i) => `
        ${i>0?'<div class="evo-arrow">→</div>':''}
        <div class="evo-step"><span class="evo-icon">${e.icon}</span><div class="evo-name">${e.name}</div><div class="evo-lvl">${e.lvl}</div></div>
      `).join('')}
    </div>
  </section>

  <section class="stat-section">
    <h2>📦 获取方式</h2>
    <div class="obtain-list">
      ${pet.obtain.map(o => `<div class="obtain-item"><span class="dot"></span><div>${o}</div></div>`).join('')}
    </div>
  </section>

  <section class="other-pets">
    <h2>🔄 其他宠物</h2>
    <div class="other-grid">
      ${Object.values(pets).filter(p=>p.id!==pet.id).slice(0,12).map(p => `
        <a class="other-link" href="pet.html?id=${p.id}">
          <span class="icon">${p.icon}</span>
          <span class="name">${p.name}</span>
        </a>
      `).join('')}
    </div>
  </section>`;

  document.getElementById('petContent').innerHTML = html;
}

renderPet(pets[getPetId()]);
</script>
