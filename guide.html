    date:'2026-04',read:'25',views:'31.2k',
    content:`
<p>宠物培养是洛克王国最核心的长期系统。本文从<strong>天赋值、努力值、性格、技能</strong>四个维度系统讲解最优培养策略。</p>

<h2>一、天赋值（IV）</h2>
<p>每只宠物出生时6项属性各有 0-31 的随机天赋值。天赋值不可改变（除非洗练），对满级属性的影响约为 ±15%。</p>
<h3>洗练优先级</h3>
<ul>
  <li>S级宠物：必须洗到 5V（5项31）+ 1项25+</li>
  <li>A级宠物：4V即可，速度必满</li>
  <li>B级及以下：随缘，不需要投入洛克钻</li>
</ul>
<h3>洗练策略</h3>
<div class="tip">先升到满级再洗天赋！低级时看不出天赋的实际影响。洗练石可以通过道馆挑战和商城获取。</div>

<h2>二、努力值（EV）</h2>
<p>通过战斗获得的额外属性点，每只宠物最多510点，单项最多255点（实际有效252点，每4点加1属性）。</p>
<h3>推荐分配方案</h3>
<ul>
  <li><strong>速攻手</strong>（翼王/霹雳雷球）：252速度 + 252攻击/特攻 + 6HP</li>
  <li><strong>坦克</strong>（岩石巨人/奇丽草）：252HP + 252防御/特防 + 6攻击</li>
  <li><strong>混合</strong>（圣龙阿布）：252攻击 + 128速度 + 128HP</li>
</ul>

<h2>三、性格修正</h2>
<p>31种性格中，只有少数有实战价值。性格修正 ±10% 对应属性。</p>
<ul>
  <li><strong>物理攻击手</strong>：固执（+攻-特攻）或 开朗（+速-特攻）</li>
  <li><strong>特殊攻击手</strong>：保守（+特攻-攻）或 胆小（+速-攻）</li>
  <li><strong>坦克</strong>：大胆（+防-攻）、沉着（+特防-攻）、慎重（+特防-特攻）</li>
  <li>⚠️ 任何减速的性格（勇敢、冷静、悠闲、狂妄）<strong>不要用</strong>！</li>
</ul>

<h2>四、技能搭配原则</h2>
<ul>
  <li>每只宠物至少带1个<strong>本系高威力技能</strong>（STAB加成1.5倍）</li>
  <li>至少1个<strong>补盲技能</strong>（克制自身弱点的属性）</li>
